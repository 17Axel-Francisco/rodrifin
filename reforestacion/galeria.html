    <head>
<title>Carrusel de Imágenes</title>
<style>
  .carousel-container {
    width: 500px;
    overflow: hidden;
    position: relative;
  }

  .carousel-slide {
    display: flex;
    transition: transform 0.5s ease-in-out;
  }

  .carousel-slide img {
    width: 100%;
    flex-shrink: 0;
  }

  .carousel-button {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    background-color: rgba(0, 0, 0, 0.5);
    color: white;
    border: none;
    padding: 10px;
    cursor: pointer;
  }

  .carousel-button.prev {
    left: 10px;
  }

  .carousel-button.next {
    right: 10px;
  }
</style>
</head>
<body>

  <div class="carousel-container">
    <div class="carousel-slide">
      <img src="1.jpeg" alt="Imagen 1">
      <img src="2.jpeg" alt="Imagen 2">
      <img src="3.jpeg" alt="Imagen 3">
      <img src="4.jpeg" alt="Imagen 4">
      <img src="5.jpeg" alt="Imagen 5">
    </div>
    <button class="carousel-button prev" onclick="prevSlide()">Anterior</button>
    <button class="carousel-button next" onclick="nextSlide()">Siguiente</button>
  </div>

  <script>
    let slideIndex = 0;
    const slides = document.querySelector('.carousel-slide');
    const totalSlides = document.querySelectorAll('.carousel-slide img').length;

    function showSlide(index) {
      if (index >= totalSlides) {
        slideIndex = 0;
      } else if (index < 0) {
        slideIndex = totalSlides - 1;
      } else {
        slideIndex = index;
      }
      slides.style.transform = `translateX(${-slideIndex * 100}%)`;
    }

    function nextSlide() {
      showSlide(slideIndex + 1);
    }

    function prevSlide() {
      showSlide(slideIndex - 1);
    }

    // Optional: Auto slide every few seconds
    // setInterval(nextSlide, 3000);
  </script>

</body>
